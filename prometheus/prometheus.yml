global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: "proyecto-final"

scrape_configs:
  # --- Instancias backend ---
  - job_name: "backends"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend1:5000"]
        labels:
          instance_name: "backend1"
      - targets: ["backend2:5000"]
        labels:
          instance_name: "backend2"
      - targets: ["backend3:5000"]
        labels:
          instance_name: "backend3"

  # --- Nginx exporter ---
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # --- cAdvisor ---
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # --- Prometheus se auto-monitorea ---
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]